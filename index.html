<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭个税优化计算器</title>
    <style>
        :root {
            --bg-color: #E6E9EF;
            --text-primary: #4B5D78;
            --text-secondary: #8A97A8;
            
            --accent-blue: #6D83F2;
            --accent-green: #00D2B4;
            --accent-red: #FF6B6B;
            
            --shadow-light: #ffffff;
            --shadow-dark: #C3D0E5;
            
            --border-radius: 20px;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
        }
        .header p {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 500;
            margin: 0;
        }

        .neu-flat {
            background: var(--bg-color);
            box-shadow: 10px 10px 20px var(--shadow-dark), 
                       -10px -10px 20px var(--shadow-light);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .neu-pressed {
            background: var(--bg-color);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                       inset -6px -6px 12px var(--shadow-light);
            border-radius: 12px;
            border: none;
        }

        .city-pill {
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            margin-top: 25px;
            color: var(--text-primary);
        }
        .city-label {
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
            color: var(--text-secondary);
        }
        .city-select {
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
            background: transparent;
            cursor: pointer;
            outline: none;
            padding-right: 4px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        @media (min-width: 800px) {
            .bento-grid {
                grid-template-columns: 1fr 1fr;
            }
            .span-full {
                grid-column: span 2;
            }
        }

        .card {
            padding: 35px;
            position: relative;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }
        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            margin-right: 15px;
            color: white;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }
        .icon-blue { background: linear-gradient(145deg, #6D83F2, #5C7AEA); }
        .icon-pink { background: linear-gradient(145deg, #FF8E8E, #FF6B6B); }
        .icon-green { background: linear-gradient(145deg, #00E5C4, #00D2B4); }

        .input-group {
            margin-bottom: 20px;
        }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .input-wrapper {
            position: relative;
        }
        .currency {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
            pointer-events: none;
            font-weight: 600;
        }
        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 35px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: var(--font-stack);
        }
        .input-field:focus {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                       inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-blue);
        }
        .input-field:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        select.input-field {
            padding-left: 15px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A97A8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 14px;
        }

        .auto-calc-box {
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 16px;
            background: var(--bg-color);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .toggle-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            margin-right: 12px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            transition: .4s;
            border-radius: 30px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: linear-gradient(145deg, #ffffff, #dcdfe5);
            transition: .4s;
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        input:checked + .slider {
            background: var(--bg-color);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
            background: var(--accent-blue);
        }

        .mini-select {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 10px;
            border: none;
            background: var(--bg-color);
            color: var(--text-primary);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            outline: none;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-val {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }
        .stat-sub {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            margin-top: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), inset -2px -2px 5px rgba(255,255,255,0.5);
        }
        .tag-green { background: var(--bg-color); color: var(--accent-green); border: 1px solid rgba(0,210,180,0.1); }
        .tag-red { background: var(--bg-color); color: var(--accent-red); border: 1px solid rgba(255,107,107,0.1); }

        .rec-section {
            padding: 0 10px;
        }
        .rec-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }
        .rec-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 10px;
            padding-top: 4px;
        }
        .rec-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .rec-item {
            padding: 15px 20px;
            margin-bottom: 15px;
            font-size: 15px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
            font-weight: 500;
        }
        .check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-weight: bold;
            font-size: 14px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
        }
        .custom-checkbox {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: 0.2s;
        }
        .custom-checkbox:hover {
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        .custom-checkbox input {
            margin-right: 10px;
            accent-color: var(--accent-blue);
            width: 16px; height: 16px;
        }

        .saving-highlight {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0,210,180,0.2);
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>家庭个税优化计算器</h1>
        <p>Pro 版个税计算工具</p>
        
        <div class="neu-flat city-pill">
            <span class="city-label">社保基数城市:</span>
            <select id="citySelect" class="city-select">
                <option value="shanghai">上海 Shanghai</option>
                <option value="beijing">北京 Beijing</option>
                <option value="shenzhen">深圳 Shenzhen</option>
                <option value="guangzhou">广州 Guangzhou</option>
            </select>
        </div>
    </div>

    <div class="bento-grid">
        <!-- Person A -->
        <div class="neu-flat card">
            <div class="card-title">
                <div class="icon-circle icon-blue">A</div>
                配偶 A
            </div>
            
            <div class="bento-grid" style="gap:20px; margin-bottom:25px;">
                <div class="input-group" style="margin:0;">
                    <label class="label">税前月薪</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="salaryA" class="neu-pressed input-field" value="15000"></div>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">年终奖金</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="bonusA" class="neu-pressed input-field" value="20000"></div>
                </div>
            </div>

            <!-- Auto Calc Area -->
            <div class="auto-calc-box">
                <div class="toggle-row">
                    <label class="toggle-label">
                        <div class="switch"><input type="checkbox" id="autoInsA" checked><span class="slider"></span></div>
                        自动核算社保
                    </label>
                    <select id="fundRateA" class="mini-select">
                        <option value="0.05">公积金 5%</option>
                        <option value="0.07" selected>公积金 7%</option>
                        <option value="0.10">公积金 10%</option>
                        <option value="0.12">公积金 12%</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <span class="currency">¥</span>
                    <input type="number" id="insuranceA" class="neu-pressed input-field" disabled style="background:transparent;">
                </div>
                <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; font-weight:500;">* 根据城市基数自动计算年扣除总额</div>
            </div>

            <div class="bento-grid" style="gap:20px; margin-bottom:25px;">
                <div class="input-group" style="margin:0;">
                    <label class="label">赡养老人 (月扣除)</label>
                    <select id="elderlyA" class="neu-pressed input-field">
                        <option value="0">无</option>
                        <option value="1000">¥1000 (非独生)</option>
                        <option value="2000">¥2000 (独生)</option>
                        <option value="3000">¥3000 (新标)</option>
                    </select>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">个人养老金 (年)</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="pensionA" class="neu-pressed input-field" placeholder="0"></div>
                </div>
            </div>

            <div class="input-group">
                <label class="label">继续教育</label>
                <div class="checkbox-group">
                    <label class="custom-checkbox"><input type="checkbox" id="eduDegreeA"> 学历教育</label>
                    <label class="custom-checkbox"><input type="checkbox" id="eduCertA"> 职业证书</label>
                </div>
            </div>

            <div class="auto-calc-box" style="margin-top:25px; margin-bottom:0;">
                <div class="toggle-row" style="margin-bottom:10px;">
                    <label class="toggle-label">
                        <div class="switch"><input type="checkbox" id="autoPrepaidA" checked><span class="slider"></span></div>
                        自动核算预缴税
                    </label>
                </div>
                <div class="input-wrapper">
                    <span class="currency">¥</span>
                    <input type="number" id="prepaidA" class="neu-pressed input-field" disabled style="background:transparent;">
                </div>
                <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; font-weight:500;">
                    * 逻辑：工资 + 奖金单独计税 - 仅基础扣除 (不含赡养老人/教育/养老金等专项)
                </div>
            </div>
        </div>

        <!-- Person B -->
        <div class="neu-flat card">
            <div class="card-title">
                <div class="icon-circle icon-pink">B</div>
                配偶 B
            </div>
            
            <div class="bento-grid" style="gap:20px; margin-bottom:25px;">
                <div class="input-group" style="margin:0;">
                    <label class="label">税前月薪</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="salaryB" class="neu-pressed input-field" value="15000"></div>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">年终奖金</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="bonusB" class="neu-pressed input-field" value="20000"></div>
                </div>
            </div>

            <!-- Auto Calc Area -->
            <div class="auto-calc-box">
                <div class="toggle-row">
                    <label class="toggle-label">
                        <div class="switch"><input type="checkbox" id="autoInsB" checked><span class="slider"></span></div>
                        自动核算社保
                    </label>
                    <select id="fundRateB" class="mini-select">
                        <option value="0.05">公积金 5%</option>
                        <option value="0.07" selected>公积金 7%</option>
                        <option value="0.10">公积金 10%</option>
                        <option value="0.12">公积金 12%</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <span class="currency">¥</span>
                    <input type="number" id="insuranceB" class="neu-pressed input-field" disabled style="background:transparent;">
                </div>
                <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; font-weight:500;">* 根据城市基数自动计算年扣除总额</div>
            </div>

            <div class="bento-grid" style="gap:20px; margin-bottom:25px;">
                <div class="input-group" style="margin:0;">
                    <label class="label">赡养老人 (月扣除)</label>
                    <select id="elderlyB" class="neu-pressed input-field">
                        <option value="0">无</option>
                        <option value="1000">¥1000 (非独生)</option>
                        <option value="2000">¥2000 (独生)</option>
                        <option value="3000">¥3000 (新标)</option>
                    </select>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">个人养老金 (年)</label>
                    <div class="input-wrapper"><span class="currency">¥</span><input type="number" id="pensionB" class="neu-pressed input-field" placeholder="0"></div>
                </div>
            </div>

            <div class="input-group">
                <label class="label">继续教育</label>
                <div class="checkbox-group">
                    <label class="custom-checkbox"><input type="checkbox" id="eduDegreeB"> 学历教育</label>
                    <label class="custom-checkbox"><input type="checkbox" id="eduCertB"> 职业证书</label>
                </div>
            </div>

            <div class="auto-calc-box" style="margin-top:25px; margin-bottom:0;">
                <div class="toggle-row" style="margin-bottom:10px;">
                    <label class="toggle-label">
                        <div class="switch"><input type="checkbox" id="autoPrepaidB" checked><span class="slider"></span></div>
                        自动核算预缴税
                    </label>
                </div>
                <div class="input-wrapper">
                    <span class="currency">¥</span>
                    <input type="number" id="prepaidB" class="neu-pressed input-field" disabled style="background:transparent;">
                </div>
                <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; font-weight:500;">
                    * 逻辑：工资 + 奖金单独计税 - 仅基础扣除 (不含赡养老人/教育/养老金等专项)
                </div>
            </div>
        </div>

        <!-- Shared Section -->
        <div class="neu-flat card span-full">
            <div class="card-title">
                <div class="icon-circle icon-green">H</div>
                家庭共享扣除
            </div>
            <div class="bento-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:25px;">
                <div class="input-group" style="margin:0;">
                    <label class="label">子女教育 (3岁+)</label>
                    <select id="childEdu" class="neu-pressed input-field">
                        <option value="0">0人</option>
                        <option value="1">1人</option>
                        <option value="2">2人</option>
                        <option value="3">3人</option>
                    </select>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">婴幼儿照护 (3岁-)</label>
                    <select id="infantEdu" class="neu-pressed input-field">
                        <option value="0">0人</option>
                        <option value="1">1人</option>
                        <option value="2">2人</option>
                    </select>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">首套房贷利息</label>
                    <select id="hasLoan" class="neu-pressed input-field">
                        <option value="0">无</option>
                        <option value="1">有 (¥1000/月)</option>
                    </select>
                </div>
                <div class="input-group" style="margin:0;">
                    <label class="label">住房租金 (无房贷)</label>
                    <select id="rentCity" class="neu-pressed input-field">
                        <option value="0">无</option>
                        <option value="1500">省会/直辖 (1500)</option>
                        <option value="1100">大城市 (1100)</option>
                        <option value="800">中小城市 (800)</option>
                    </select>
                </div>
            </div>
            
            <div style="margin-top:30px; padding-top:30px; border-top:1px solid rgba(0,0,0,0.05);">
                 <label class="label">大病医疗 (年度自付 > 1.5万的部分)</label>
                 <div class="bento-grid">
                     <div class="input-wrapper"><span class="currency">A</span><input type="number" id="diseaseA" class="neu-pressed input-field" placeholder="A 的金额"></div>
                     <div class="input-wrapper"><span class="currency">B</span><input type="number" id="diseaseB" class="neu-pressed input-field" placeholder="B 的金额"></div>
                 </div>
            </div>
        </div>
        
        <!-- Result Section -->
        <div class="neu-flat card span-full">
            <div id="loading" style="display:none; color:gray;">计算最优方案中...</div>
            
            <div id="results">
                <div class="result-stats">
                    <div class="neu-flat stat-item">
                        <div class="stat-label">家庭总税负 (最优)</div>
                        <div class="stat-val" id="resTotal" style="color:var(--accent-green);">¥0</div>
                        <div class="stat-sub">比错误申报节省 <span id="resSave" class="saving-highlight" style="font-weight:700;">¥0</span></div>
                    </div>
                    <div class="neu-flat stat-item">
                        <div class="stat-label">A 最终纳税</div>
                        <div class="stat-val" id="resTaxA">¥0</div>
                        <div class="stat-sub" id="resModeA">...</div>
                        <div id="refundTagA"></div>
                    </div>
                    <div class="neu-flat stat-item">
                        <div class="stat-label">B 最终纳税</div>
                        <div class="stat-val" id="resTaxB">¥0</div>
                        <div class="stat-sub" id="resModeB">...</div>
                        <div id="refundTagB"></div>
                    </div>
                </div>

                <div class="rec-section">
                    <div class="rec-title">
                        <span style="font-size:28px; margin-right:10px;">💡</span> 推荐分配方案 
                        <span class="rec-subtitle">(仅做参考)</span>
                    </div>
                    <ul class="rec-list" id="recList">
                        <!-- Content -->
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
// Logic remains identical, just binding to new IDs
const cityData = {
    shanghai: { baseMax: 36921, baseMin: 7384, rates: { pension: 0.08, med: 0.02, unemp: 0.005 } },
    beijing:  { baseMax: 35283, baseMin: 6326, rates: { pension: 0.08, med: 0.02, unemp: 0.005 } },
    shenzhen: { baseMax: 26421, baseMin: 3523, rates: { pension: 0.08, med: 0.02, unemp: 0.003 } },
    guangzhou:{ baseMax: 26421, baseMin: 5284, rates: { pension: 0.08, med: 0.02, unemp: 0.002 } }
};

const brackets = [
    { limit: 36000, rate: 0.03, quick: 0 },
    { limit: 144000, rate: 0.10, quick: 2520 },
    { limit: 300000, rate: 0.20, quick: 16920 },
    { limit: 420000, rate: 0.25, quick: 31920 },
    { limit: 660000, rate: 0.30, quick: 52920 },
    { limit: 960000, rate: 0.35, quick: 85920 },
    { limit: Infinity, rate: 0.45, quick: 181920 }
];

function getVal(id) { 
    const el = document.getElementById(id);
    return el.type === 'checkbox' ? el.checked : Number(el.value);
}
function setVal(id, val) { document.getElementById(id).value = val; }
function fmt(num) { return num.toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }

function calcInsurance(salary, city, fundRate) {
    const c = cityData[city];
    const base = Math.min(c.baseMax, Math.max(c.baseMin, salary));
    const monthly = base * (c.rates.pension + c.rates.med + c.rates.unemp);
    const fund = Math.min(c.baseMax, salary) * fundRate; 
    return Math.round((monthly + fund) * 12);
}

function calcTax(taxable) {
    if (taxable <= 0) return { tax: 0, rate: 0 };
    for (let b of brackets) {
        if (taxable <= b.limit) return { tax: taxable * b.rate - b.quick, rate: b.rate * 100 };
    }
    return { tax: 0, rate: 0 };
}

function calcBonusTax(bonus) {
    if (bonus <= 0) return { tax: 0, rate: 0 };
    const monthly = bonus / 12;
    let rate = 0.03, quick = 0;
    if (monthly <= 3000) { rate = 0.03; quick = 0; }
    else if (monthly <= 12000) { rate = 0.10; quick = 210; }
    else if (monthly <= 25000) { rate = 0.20; quick = 1410; }
    else if (monthly <= 35000) { rate = 0.25; quick = 2660; }
    else if (monthly <= 55000) { rate = 0.30; quick = 4410; }
    else if (monthly <= 80000) { rate = 0.35; quick = 7160; }
    else { rate = 0.45; quick = 15160; }
    return { tax: bonus * rate - quick, rate: rate * 100 };
}

// Fixed: Only standard deduction (60000) and insurance
function calcPrepaidTax(salary, bonus, insurance) {
    // 60000 is standard yearly deduction
    const taxableSalary = Math.max(0, (salary * 12) - insurance - 60000);
    const salaryTax = calcTax(taxableSalary).tax;
    const bonusTax = calcBonusTax(bonus).tax;
    return salaryTax + bonusTax;
}

function updateInsuranceUI() {
    const city = document.getElementById('citySelect').value;
    
    if(getVal('autoInsA')) {
        const ins = calcInsurance(getVal('salaryA'), city, getVal('fundRateA'));
        setVal('insuranceA', ins);
    } else {
        document.getElementById('insuranceA').disabled = false;
    }

    if(getVal('autoInsB')) {
        const ins = calcInsurance(getVal('salaryB'), city, getVal('fundRateB'));
        setVal('insuranceB', ins);
    } else {
        document.getElementById('insuranceB').disabled = false;
    }
}

function runOptimization() {
    updateInsuranceUI();

    const pA = {
        salaryMonthly: getVal('salaryA'),
        salary: getVal('salaryA') * 12,
        bonus: getVal('bonusA'),
        ins: getVal('insuranceA'),
        fixedDeduct: (getVal('elderlyA')*12) + (getVal('eduDegreeA')?4800:0) + (getVal('eduCertA')?3600:0) + Math.min(12000, getVal('pensionA'))
    };
    const pB = {
        salaryMonthly: getVal('salaryB'),
        salary: getVal('salaryB') * 12,
        bonus: getVal('bonusB'),
        ins: getVal('insuranceB'),
        fixedDeduct: (getVal('elderlyB')*12) + (getVal('eduDegreeB')?4800:0) + (getVal('eduCertB')?3600:0) + Math.min(12000, getVal('pensionB'))
    };

    if(getVal('autoPrepaidA')) {
        const preA = calcPrepaidTax(pA.salaryMonthly, pA.bonus, pA.ins);
        setVal('prepaidA', Math.round(preA));
        document.getElementById('prepaidA').disabled = true;
    } else {
        document.getElementById('prepaidA').disabled = false;
    }

    if(getVal('autoPrepaidB')) {
        const preB = calcPrepaidTax(pB.salaryMonthly, pB.bonus, pB.ins);
        setVal('prepaidB', Math.round(preB));
        document.getElementById('prepaidB').disabled = true;
    } else {
        document.getElementById('prepaidB').disabled = false;
    }

    const shared = {
        childTotal: (getVal('childEdu') + getVal('infantEdu')) * 2000 * 12,
        childUnits: (getVal('childEdu') + getVal('infantEdu')) * 2,
        loan: getVal('hasLoan') === 1,
        rent: getVal('rentCity') * 12,
        disA: Math.min(80000, Math.max(0, getVal('diseaseA') - 15000)),
        disB: Math.min(80000, Math.max(0, getVal('diseaseB') - 15000))
    };

    let best = { tax: Infinity, recs: [] };
    let worstTax = 0;

    const childSteps = [];
    for(let i=0; i<=shared.childUnits; i++) childSteps.push(i * 12000);

    // Updated housing options: Include 50/50 split
    let housingOpts = [{a:0, b:0, t:""}];
    if (shared.loan) {
        housingOpts = [
            {a:12000, b:0, t:"房贷利息: A 扣除 (100%)"},
            {a:0, b:12000, t:"房贷利息: B 扣除 (100%)"},
            {a:6000, b:6000, t:"房贷利息: 各扣 50%"}
        ];
    } else if (shared.rent > 0) {
        housingOpts = [
            {a:shared.rent, b:0, t:"住房租金: A 扣除"},
            {a:0, b:shared.rent, t:"住房租金: B 扣除"}
        ];
    }

    const disAOpts = shared.disA > 0 ? [{a:shared.disA, b:0, t:"A的大病: A 扣除"}, {a:0, b:shared.disA, t:"A的大病: B 扣除"}] : [{a:0, b:0, t:""}];
    const disBOpts = shared.disB > 0 ? [{a:shared.disB, b:0, t:"B的大病: A 扣除"}, {a:0, b:shared.disB, t:"B的大病: B 扣除"}] : [{a:0, b:0, t:""}];

    const modes = ['independent', 'combined'];

    for(let modeA of modes) {
        for(let modeB of modes) {
            for(let cA of childSteps) {
                let cB = shared.childTotal - cA;
                for(let h of housingOpts) {
                    for(let dA of disAOpts) {
                        for(let dB of disBOpts) {
                            
                            let taxA = 0, bonusTaxA = 0;
                            let incomeA = pA.salary;
                            if(modeA === 'independent') {
                                bonusTaxA = calcBonusTax(pA.bonus).tax;
                            } else {
                                incomeA += pA.bonus;
                            }
                            let dedA = pA.ins + 60000 + pA.fixedDeduct + cA + h.a + dA.a + dB.a;
                            let resA = calcTax(Math.max(0, incomeA - dedA));
                            let totalA = resA.tax + bonusTaxA;

                            let taxB = 0, bonusTaxB = 0;
                            let incomeB = pB.salary;
                            if(modeB === 'independent') {
                                bonusTaxB = calcBonusTax(pB.bonus).tax;
                            } else {
                                incomeB += pB.bonus;
                            }
                            let dedB = pB.ins + 60000 + pB.fixedDeduct + cB + h.b + dA.b + dB.b;
                            let resB = calcTax(Math.max(0, incomeB - dedB));
                            let totalB = resB.tax + bonusTaxB;

                            let total = totalA + totalB;
                            if(total > worstTax) worstTax = total;

                            if(total < best.tax) {
                                let recs = [];
                                if(shared.childTotal > 0) {
                                    if(cA === shared.childTotal) recs.push("子女教育/照护: 全部 A 扣");
                                    else if(cA === 0) recs.push("子女教育/照护: 全部 B 扣");
                                    else recs.push(`子女教育/照护: A扣¥${cA}, B扣¥${cB}`);
                                }
                                if(h.t) recs.push(h.t);
                                if(dA.t) recs.push(dA.t);
                                if(dB.t) recs.push(dB.t);

                                best = {
                                    tax: total,
                                    taxA: totalA,
                                    rateA: resA.rate,
                                    modeA: modeA,
                                    taxB: totalB,
                                    rateB: resB.rate,
                                    modeB: modeB,
                                    recs: recs
                                };
                            }
                        }
                    }
                }
            }
        }
    }

    document.getElementById('resTotal').innerText = '¥' + fmt(best.tax);
    document.getElementById('resSave').innerText = '¥' + fmt(worstTax - best.tax);
    
    document.getElementById('resTaxA').innerText = '¥' + fmt(best.taxA);
    document.getElementById('resModeA').innerText = `税率 ${best.rateA}% | ${best.modeA==='independent'?'奖金单独计税':'奖金合并计税'}`;
    
    document.getElementById('resTaxB').innerText = '¥' + fmt(best.taxB);
    document.getElementById('resModeB').innerText = `税率 ${best.rateB}% | ${best.modeB==='independent'?'奖金单独计税':'奖金合并计税'}`;

    const prepA = getVal('prepaidA');
    const refA = prepA - best.taxA;
    const tagA = document.getElementById('refundTagA');
    if(prepA > 0) {
        if(refA >= 0) tagA.innerHTML = `<span class="tag tag-green">退税 ¥${fmt(refA)}</span>`;
        else tagA.innerHTML = `<span class="tag tag-red">补税 ¥${fmt(Math.abs(refA))}</span>`;
    } else tagA.innerHTML = '';

    const prepB = getVal('prepaidB');
    const refB = prepB - best.taxB;
    const tagB = document.getElementById('refundTagB');
    if(prepB > 0) {
        if(refB >= 0) tagB.innerHTML = `<span class="tag tag-green">退税 ¥${fmt(refB)}</span>`;
        else tagB.innerHTML = `<span class="tag tag-red">补税 ¥${fmt(Math.abs(refB))}</span>`;
    } else tagB.innerHTML = '';

    const list = document.getElementById('recList');
    list.innerHTML = '';
    
    let liA = document.createElement('li');
    liA.className = 'neu-flat rec-item';
    liA.innerHTML = `<span class="check">✓</span> <div>A 年终奖申报: <b>${best.modeA==='independent'?'单独计税':'并入综合所得'}</b></div>`;
    list.appendChild(liA);

    let liB = document.createElement('li');
    liB.className = 'neu-flat rec-item';
    liB.innerHTML = `<span class="check">✓</span> <div>B 年终奖申报: <b>${best.modeB==='independent'?'单独计税':'并入综合所得'}</b></div>`;
    list.appendChild(liB);

    best.recs.forEach(r => {
        let li = document.createElement('li');
        li.className = 'neu-flat rec-item';
        li.innerHTML = `<span class="check">✓</span> ${r}`;
        list.appendChild(li);
    });
}

document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', runOptimization);
    el.addEventListener('change', runOptimization);
});

document.getElementById('autoInsA').addEventListener('change', (e) => {
    document.getElementById('insuranceA').disabled = e.target.checked;
    runOptimization();
});
document.getElementById('autoInsB').addEventListener('change', (e) => {
    document.getElementById('insuranceB').disabled = e.target.checked;
    runOptimization();
});
document.getElementById('autoPrepaidA').addEventListener('change', runOptimization);
document.getElementById('autoPrepaidB').addEventListener('change', runOptimization);

runOptimization();
</script>
</body>
</html>
